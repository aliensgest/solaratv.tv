<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L7wayej Shop | تشكيلة الرجال</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
    }
    body {
      background: #000;
      color: #fff;
    }
    /* شريط التخفيضات العلوي مثل موقع Defacto */
    .promo-bar {
      background: #fff;
      color: #000;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    /* الهيدر */
    header {
      background: #000;
      border-bottom: 1px solid #222;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo h1 {
      font-size: 1.8rem;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: #fff;
      border: 1px solid #fff;
      padding: 2px 8px;
      font-size: 0.7rem;
      margin-right: 5px;
    }
    nav {
      display: flex;
      gap: 25px;
    }
    nav a {
      color: #eee;
      text-decoration: none;
      font-weight: 500;
    }
    .icons {
      display: flex;
      gap: 20px;
      font-size: 1.3rem;
    }
    .icons i {
      cursor: pointer;
    }
    /* فلتر جانبي + شبكة المنتجات */
    .main-layout {
      display: flex;
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
      gap: 40px;
    }
    .filters {
      width: 240px;
      border-left: 1px solid #222;
      padding-left: 20px;
    }
    .filters h4 {
      margin: 20px 0 10px;
    }
    .filters label {
      display: block;
      margin: 8px 0;
      font-size: 0.9rem;
      color: #ccc;
    }
    .products-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
    }
    .product-card {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.2s;
    }
    .product-card:hover {
      border-color: #fff;
      transform: translateY(-3px);
    }
    .product-img {
      background: #111;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      border-bottom: 1px solid #222;
    }
    .product-info {
      padding: 15px;
    }
    .product-title {
      font-weight: bold;
      margin-bottom: 6px;
    }
    .price {
      color: #fff;
      font-weight: bold;
      margin: 10px 0;
    }
    .old-price {
      color: #aaa;
      text-decoration: line-through;
      font-size: 0.8rem;
      margin-right: 8px;
    }
    .btn-add {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      padding: 8px;
      width: 100%;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-add:hover {
      background: #fff;
      color: #000;
    }
    /* سلة جانبية */
    .cart-sidebar {
      position: fixed;
      top: 0;
      left: -380px;
      width: 350px;
      height: 100%;
      background: #0a0a0a;
      border-left: 2px solid #fff;
      z-index: 1000;
      padding: 20px;
      transition: 0.3s;
      overflow-y: auto;
    }
    .cart-sidebar.open {
      left: 0;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .total {
      font-weight: bold;
      margin: 15px 0;
      font-size: 1.2rem;
    }
    .close-cart {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px;
      width: 100%;
      margin-top: 15px;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      display: none;
    }
    footer {
      background: #030303;
      text-align: center;
      padding: 30px;
      border-top: 1px solid #222;
      margin-top: 50px;
    }
    @media (max-width: 800px) {
      .main-layout { flex-direction: column; }
      .filters { width: 100%; border-left: none; }
    }
  </style>
</head>
<body>

<div class="promo-bar">🎁 HEY10 : خصم 10% على أول طلب | شحن مجاني فوق 399 درهم</div>

<header>
  <div class="logo">
    <h1>L7WAYEJ <span>SHOP</span></h1>
  </div>
  <nav>
    <a href="#">الرجال</a>
    <a href="#">تيشرتات</a>
    <a href="#">بدلات رياضية</a>
    <a href="#">عروض</a>
  </nav>
  <div class="icons">
    <i class="far fa-heart"></i>
    <i class="fas fa-shopping-bag" id="cartIcon"></i>
    <i class="far fa-user"></i>
  </div>
</header>

<div class="main-layout">
  <aside class="filters">
    <h4>التصنيف</h4>
    <label><input type="checkbox" value="tshirt" class="filter-cat"> تيشرتات</label>
    <label><input type="checkbox" value="suit" class="filter-cat"> بدلات رياضية</label>
    <h4>السعر</h4>
    <label><input type="range" id="priceFilter" min="0" max="500" step="10" value="500"> حتى <span id="priceVal">500</span> درهم</label>
  </aside>

  <div class="products-grid" id="productsGrid"></div>
</div>

<footer>
  <p>© 2025 L7wayej Shop – جميع الحقوق محفوظة | تصميم مستوحى من دي فاكتو</p>
  <p style="margin-top: 8px;">Marhba bikom f L7wayej Shop 😍</p>
</footer>

<div class="overlay" id="overlay"></div>
<div class="cart-sidebar" id="cartSidebar">
  <h3>🛒 سلة التسوق</h3>
  <div id="cartItemsList"></div>
  <div class="total" id="cartTotal"></div>
  <button class="close-cart" id="checkoutBtn">إتمام الشراء</button>
  <button class="close-cart" id="closeCartBtn" style="background:#222; color:#fff; margin-top:8px;">إغلاق</button>
</div>

<script>
  const products = [
    { id:1, name:"تيشرت أسود مخطط", category:"tshirt", price:129, oldPrice:159, icon:"👕" },
    { id:2, name:"تيشرت رياضي Slim", category:"tshirt", price:119, oldPrice:149, icon:"⚫" },
    { id:3, name:"تيشرت بخطوط عريضة", category:"tshirt", price:139, oldPrice:169, icon:"🎽" },
    { id:4, name:"بدلة رياضية سوداء", category:"suit", price:349, oldPrice:429, icon:"🧥" },
    { id:5, name:"طقم جاكيت وبنطلون", category:"suit", price:389, oldPrice:479, icon:"👔" },
    { id:6, name:"بدلة بمخططات بيضاء", category:"suit", price:399, oldPrice:499, icon:"🏃" },
    { id:7, name:"تيشرت أوفر سايز", category:"tshirt", price:109, oldPrice:129, icon:"🖤" },
    { id:8, name:"بدلة رياضية فاخرة", category:"suit", price:419, oldPrice:529, icon:"✨" }
  ];

  let cart = [];
  
  function renderProducts() {
    const selectedCats = Array.from(document.querySelectorAll('.filter-cat:checked')).map(cb => cb.value);
    const maxPrice = parseInt(document.getElementById('priceFilter').value);
    let filtered = products.filter(p => (selectedCats.length === 0 || selectedCats.includes(p.category)) && p.price <= maxPrice);
    const grid = document.getElementById('productsGrid');
    if(filtered.length === 0) {
      grid.innerHTML = '<p style="text-align:center; width:100%;">لا توجد منتجات مطابقة</p>';
      return;
    }
    grid.innerHTML = filtered.map(p => `
      <div class="product-card">
        <div class="product-img">${p.icon}</div>
        <div class="product-info">
          <div class="product-title">${p.name}</div>
          <div class="price">${p.price} درهم <span class="old-price">${p.oldPrice} درهم</span></div>
          <button class="btn-add" onclick="addToCart(${p.id})">أضف إلى السلة</button>
        </div>
      </div>
    `).join('');
  }
  
  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(i => i.id === id);
    if(existing) existing.qty++;
    else cart.push({ ...product, qty: 1 });
    updateCartUI();
    openCart();
  }
  
  function updateCartUI() {
    const container = document.getElementById('cartItemsList');
    if(cart.length === 0) container.innerHTML = '<p>السلة فارغة</p>';
    else {
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div><strong>${item.name}</strong><br>${item.price} درهم × ${item.qty}</div>
          <div>
            <button onclick="changeQty(${item.id}, -1)">-</button>
            <span style="margin:0 6px;">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)">+</button>
            <button onclick="removeItem(${item.id})" style="background:none; border:none; color:#ff8888;"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }
    const total = cart.reduce((s,i) => s + (i.price * i.qty), 0);
    document.getElementById('cartTotal').innerHTML = `المجموع: ${total} درهم`;
  }
  
  function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if(item) {
      item.qty += delta;
      if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }
  }
  function removeItem(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); }
  
  // السلة الجانبية
  const cartIcon = document.getElementById('cartIcon');
  const cartSidebar = document.getElementById('cartSidebar');
  const overlayDiv = document.getElementById('overlay');
  function openCart() { cartSidebar.classList.add('open'); overlayDiv.style.display = 'block'; }
  function closeCart() { cartSidebar.classList.remove('open'); overlayDiv.style.display = 'none'; }
  cartIcon.onclick = openCart;
  document.getElementById('closeCartBtn').onclick = closeCart;
  overlayDiv.onclick = closeCart;
  document.getElementById('checkoutBtn').onclick = () => { if(cart.length) alert(`تم إرسال طلبك بمبلغ ${cart.reduce((s,i)=>s+(i.price*i.qty),0)} درهم`); else alert("السلة فارغة"); };
  
  document.querySelectorAll('.filter-cat').forEach(cb => cb.addEventListener('change', renderProducts));
  document.getElementById('priceFilter').addEventListener('input', function(e) {
    document.getElementById('priceVal').innerText = e.target.value;
    renderProducts();
  });
  renderProducts();
</script>
</body>
</html>
