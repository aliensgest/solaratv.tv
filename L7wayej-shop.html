<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L7wayej Shop | ملابس رجالية - تيشرتات - بدلات رياضية</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
    }

    body {
      background: #000000;
      color: #ffffff;
    }

    .promo-bar {
      background: #ffffff;
      color: #000000;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    header {
      background: #000000;
      border-bottom: 1px solid #222222;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo h1 {
      font-size: 1.8rem;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: #fff;
      border: 1px solid #fff;
      padding: 2px 8px;
      font-size: 0.7rem;
      margin-right: 5px;
    }

    nav {
      display: flex;
      gap: 25px;
    }
    nav a {
      color: #eeeeee;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }
    nav a:hover {
      color: #ffffff;
      border-bottom: 2px solid white;
    }

    .icons {
      display: flex;
      gap: 20px;
      font-size: 1.3rem;
    }
    .icons i {
      cursor: pointer;
    }

    .category-title {
      text-align: center;
      margin: 40px 0 20px;
      font-size: 2rem;
      font-weight: bold;
    }

    .main-layout {
      display: flex;
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
      gap: 40px;
    }

    .filters {
      width: 250px;
      border-left: 1px solid #333333;
      padding-left: 20px;
    }
    .filters h4 {
      margin: 20px 0 10px;
      font-size: 1rem;
    }
    .filters label {
      display: block;
      margin: 8px 0;
      font-size: 0.9rem;
      color: #cccccc;
    }
    .filters input[type="checkbox"] {
      margin-left: 8px;
    }
    .price-range {
      width: 100%;
      margin: 10px 0;
    }

    .products-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.25s;
    }
    .product-card:hover {
      border-color: #ffffff;
      transform: translateY(-4px);
    }
    .product-img {
      height: 280px;
      overflow: hidden;
      background: #111111;
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
    }
    .product-card:hover .product-img img {
      transform: scale(1.03);
    }
    .product-info {
      padding: 15px;
    }
    .product-title {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .price {
      color: #ffffff;
      font-weight: bold;
      margin: 10px 0;
      font-size: 1.1rem;
    }
    .old-price {
      color: #aaaaaa;
      text-decoration: line-through;
      font-size: 0.8rem;
      margin-right: 8px;
    }
    .badge-new {
      background: #ffffff;
      color: #000000;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .btn-add {
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 8px;
      width: 100%;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-add:hover {
      background: #ffffff;
      color: #000000;
    }

    .pagination {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 50px 0 30px;
    }
    .page-number {
      background: transparent;
      border: 1px solid #333333;
      color: #cccccc;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }
    .page-number:hover, .page-number.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      left: -380px;
      width: 350px;
      height: 100%;
      background: #0a0a0a;
      border-left: 2px solid #ffffff;
      z-index: 1000;
      padding: 20px;
      transition: 0.3s;
      overflow-y: auto;
    }
    .cart-sidebar.open {
      left: 0;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 1px solid #333333;
      padding-bottom: 10px;
    }
    .total {
      font-weight: bold;
      margin: 15px 0;
      font-size: 1.2rem;
    }
    .close-cart {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      display: none;
    }

    footer {
      background: #050505;
      text-align: center;
      padding: 30px;
      border-top: 1px solid #222222;
      margin-top: 30px;
    }

    @media (max-width: 800px) {
      .main-layout { flex-direction: column; }
      .filters { width: 100%; border-left: none; padding-left: 0; }
      .pagination { gap: 5px; }
      .page-number { width: 32px; height: 32px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="promo-bar">
  🎁 HEY10 : خصم 10% على أول طلب | شحن مجاني للطلبات ابتداءً من 399 درهم
</div>

<header>
  <div class="logo">
    <h1>L7WAYEJ <span>SHOP</span></h1>
  </div>
  <nav>
    <a href="#">رجال</a>
    <a href="#">سويت شيرتات</a>
    <a href="#">تيشرتات</a>
    <a href="#">بدلات رياضية</a>
  </nav>
  <div class="icons">
    <i class="far fa-heart"></i>
    <i class="fas fa-shopping-bag" id="cartIcon"></i>
    <i class="far fa-user"></i>
  </div>
</header>

<div class="category-title">
  👕 تشكيلة الملابس الرجالية
</div>

<div class="main-layout">
  <aside class="filters">
    <h4>التصنيف</h4>
    <label><input type="checkbox" value="sweatshirt" class="filter-cat"> سويت شيرتات</label>
    <label><input type="checkbox" value="tshirt" class="filter-cat"> تيشرتات</label>
    <label><input type="checkbox" value="suit" class="filter-cat"> بدلات رياضية</label>
    <label><input type="checkbox" value="new" class="filter-cat"> جديد</label>
    <h4>السعر</h4>
    <input type="range" id="priceFilter" min="0" max="600" step="10" value="600" class="price-range">
    <span>حتى <span id="priceVal">600</span> درهم</span>
  </aside>

  <div class="products-grid" id="productsGrid"></div>
</div>

<div class="pagination" id="pagination"></div>

<footer>
  <p>© 2025 L7wayej Shop – جميع الحقوق محفوظة | تصميم مستوحى من DeFacto</p>
  <p style="margin-top: 8px;">Marhba bikom f L7wayej Shop 😍❤️</p>
</footer>

<div class="overlay" id="overlay"></div>
<div class="cart-sidebar" id="cartSidebar">
  <h3>🛒 سلة التسوق</h3>
  <div id="cartItemsList"></div>
  <div class="total" id="cartTotal"></div>
  <button class="close-cart" id="checkoutBtn">إتمام الشراء</button>
  <button class="close-cart" id="closeCartBtn" style="background:#222; color:#fff; margin-top:8px;">إغلاق</button>
</div>

<script>
  // جميع المنتجات مع صور حقيقية
  const products = [
    // سويت شيرتات
    { id:1, name:"High Collar Sweatshirt", category:"sweatshirt", price:269, oldPrice:null, isNew:true, image:"https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400&h=500&fit=crop" },
    { id:2, name:"Regular Fit Sweatshirt", category:"sweatshirt", price:269, oldPrice:null, isNew:true, image:"https://images.unsplash.com/photo-1578587018452-892bacefd3f2?w=400&h=500&fit=crop" },
    { id:3, name:"Long Sleeve Sweatshirt", category:"sweatshirt", price:199, oldPrice:249, isNew:true, image:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400&h=500&fit=crop" },
    { id:4, name:"Oversized Hoodie", category:"sweatshirt", price:289, oldPrice:329, isNew:false, image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400&h=500&fit=crop" },
    
    // تيشرتات
    { id:5, name:"Classic Cotton T-Shirt", category:"tshirt", price:89, oldPrice:129, isNew:true, image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=500&fit=crop" },
    { id:6, name:"Black Slim Fit Tee", category:"tshirt", price:79, oldPrice:null, isNew:false, image:"https://images.unsplash.com/photo-1581655353564-df123a1ebf23?w=400&h=500&fit=crop" },
    { id:7, name:"White Essential Tee", category:"tshirt", price:69, oldPrice:99, isNew:true, image:"https://images.unsplash.com/photo-1586363104866-3c5a2a3924b4?w=400&h=500&fit=crop" },
    { id:8, name:"Graphic Print T-Shirt", category:"tshirt", price:99, oldPrice:149, isNew:true, image:"https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=400&h=500&fit=crop" },
    { id:9, name:"Striped Casual Tee", category:"tshirt", price:109, oldPrice:null, isNew:false, image:"https://images.unsplash.com/photo-1509631179647-0177331693ae?w=400&h=500&fit=crop" },
    
    // بدلات رياضية
    { id:10, name:"Sports Track Suit", category:"suit", price:349, oldPrice:429, isNew:true, image:"https://images.unsplash.com/photo-1539037116277-4db20889f2d4?w=400&h=500&fit=crop" },
    { id:11, name:"Training Jacket & Pants", category:"suit", price:389, oldPrice:479, isNew:false, image:"https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&h=500&fit=crop" },
    { id:12, name:"Athletic Zip Hoodie Set", category:"suit", price:399, oldPrice:499, isNew:true, image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400&h=500&fit=crop" },
    { id:13, name:"Premium Sports Suit", category:"suit", price:419, oldPrice:529, isNew:false, image:"https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=400&h=500&fit=crop" },
    { id:14, name:"Summer Track Set", category:"suit", price:299, oldPrice:369, isNew:true, image:"https://images.unsplash.com/photo-1518049362265-d5b2a6467637?w=400&h=500&fit=crop" },
    
    // المزيد من التيشرتات
    { id:15, name:"V-Neck Soft Tee", category:"tshirt", price:85, oldPrice:null, isNew:false, image:"https://images.unsplash.com/photo-1583744946564-b52ac1c389c8?w=400&h=500&fit=crop" },
    { id:16, name:"Polo Casual Shirt", category:"tshirt", price:129, oldPrice:169, isNew:true, image:"https://images.unsplash.com/photo-1586363104866-3c5a2a3924b4?w=400&h=500&fit=crop" }
  ];

  let cart = [];
  let currentPage = 1;
  const itemsPerPage = 8;

  function renderProducts() {
    const selectedCats = Array.from(document.querySelectorAll('.filter-cat:checked')).map(cb => cb.value);
    const maxPrice = parseInt(document.getElementById('priceFilter').value);
    
    let filtered = products.filter(p => {
      let match = true;
      if(selectedCats.length > 0 && !selectedCats.includes('new') && !selectedCats.includes(p.category)) match = false;
      if(selectedCats.includes('new') && !p.isNew) match = false;
      if(p.price > maxPrice) match = false;
      return match;
    });
    
    const totalPages = Math.ceil(filtered.length / itemsPerPage);
    const start = (currentPage - 1) * itemsPerPage;
    const paginated = filtered.slice(start, start + itemsPerPage);
    
    const grid = document.getElementById('productsGrid');
    if(paginated.length === 0) {
      grid.innerHTML = '<p style="text-align:center; width:100%;">لا توجد منتجات مطابقة</p>';
    } else {
      grid.innerHTML = paginated.map(p => `
        <div class="product-card">
          <div class="product-img">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="product-info">
            ${p.isNew ? '<div class="badge-new">جديد</div>' : ''}
            <div class="product-title">${p.name}</div>
            <div class="price">
              ${p.price} درهم
              ${p.oldPrice ? `<span class="old-price">${p.oldPrice} درهم</span>` : ''}
            </div>
            <button class="btn-add" onclick="addToCart(${p.id})">أضف إلى السلة</button>
          </div>
        </div>
      `).join('');
    }
    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const paginationDiv = document.getElementById('pagination');
    let html = '';
    for(let i = 1; i <= Math.min(totalPages, 100); i++) {
      html += `<div class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</div>`;
    }
    paginationDiv.innerHTML = html;
  }

  function goToPage(page) {
    currentPage = page;
    renderProducts();
    window.scrollTo({ top: 300, behavior: 'smooth' });
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(i => i.id === id);
    if(existing) existing.qty++;
    else cart.push({ ...product, qty: 1 });
    updateCartUI();
    openCart();
  }

  function updateCartUI() {
    const container = document.getElementById('cartItemsList');
    if(cart.length === 0) {
      container.innerHTML = '<p>السلة فارغة</p>';
    } else {
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br>
            <span style="font-size:0.8rem; color:#ccc;">${item.price} درهم × ${item.qty}</span>
          </div>
          <div>
            <button onclick="changeQty(${item.id}, -1)" style="background:#333; border:none; color:white; width:28px; border-radius:6px;">-</button>
            <span style="margin:0 8px;">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" style="background:#333; border:none; color:white; width:28px; border-radius:6px;">+</button>
            <button onclick="removeItem(${item.id})" style="background:none; border:none; color:#ff8888; margin-left:8px;"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }
    const total = cart.reduce((s,i) => s + (i.price * i.qty), 0);
    document.getElementById('cartTotal').innerHTML = `المجموع: ${total} درهم`;
  }

  function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if(item) {
      item.qty += delta;
      if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }
  }
  function removeItem(id) { cart = cart.filter(i => i.id !== id); updateCartUI(); }

  const cartIcon = document.getElementById('cartIcon');
  const cartSidebar = document.getElementById('cartSidebar');
  const overlayDiv = document.getElementById('overlay');
  function openCart() { cartSidebar.classList.add('open'); overlayDiv.style.display = 'block'; }
  function closeCart() { cartSidebar.classList.remove('open'); overlayDiv.style.display = 'none'; }
  cartIcon.onclick = openCart;
  document.getElementById('closeCartBtn').onclick = closeCart;
  overlayDiv.onclick = closeCart;
  document.getElementById('checkoutBtn').onclick = () => {
    if(cart.length) alert(`شكراً لتسوقك من L7wayej Shop!\nإجمالي الطلب: ${cart.reduce((s,i)=>s+(i.price*i.qty),0)} درهم`);
    else alert("السلة فارغة");
  };

  document.querySelectorAll('.filter-cat').forEach(cb => cb.addEventListener('change', () => {
    currentPage = 1;
    renderProducts();
  }));
  document.getElementById('priceFilter').addEventListener('input', function(e) {
    document.getElementById('priceVal').innerText = e.target.value;
    currentPage = 1;
    renderProducts();
  });

  renderProducts();
</script>
</body>
</html>
