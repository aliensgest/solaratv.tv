<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | Admin - SOLARA TV</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo">SOLARA TV</a>
      <nav class="sidebar-nav">
        <a href="index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="subscriptions.html"><i class="fas fa-ticket-alt"></i> Subscriptions</a>
        <a href="device-lookup.html"><i class="fas fa-search"></i> Device Lookup</a>
        <a href="blog-editor.html"><i class="fas fa-pen-fancy"></i> Blog Manager</a>
        <a href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
        <a href="users.html" class="active"><i class="fas fa-users"></i> Users</a>
        <a href="api-settings.html"><i class="fas fa-cog"></i> API Settings</a>
        <div class="sidebar-divider"></div>
        <a href="../index.html"><i class="fas fa-globe"></i> View Site</a>
        <a href="#" onclick="Auth.logout();return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="hamburger" onclick="toggleSidebar()" style="display:none;" id="sidebarToggle"><i class="fas fa-bars"></i></button>
          <h1>Users Management</h1>
        </div>
        <div style="display:flex;gap:8px;">
          <span class="stat-card" style="padding:12px 20px;display:flex;align-items:center;gap:8px;">
            <i class="fas fa-users" style="color:var(--primary);"></i>
            <strong id="userCount">0</strong> Users
          </span>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
            <th>Source</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </main>
  </div>

  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/analytics.js"></script>
  <script>
    if (!Auth.requireAuth('admin')) {
      document.body.innerHTML = '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function roleBadge(role) {
      const cls = role === 'admin' ? 'badge-admin' : (role === 'reseller' ? 'badge-published' : 'badge-client');
      return '<span class="badge ' + cls + '">' + escapeHtml(role || 'client') + '</span>';
    }

    // localStorage users (legacy) — rendered first
    function loadLocalUsers() {
      const users = Auth.getUsers();
      const table = document.getElementById('usersTable');
      document.getElementById('userCount').textContent = users.length;
      if (users.length === 0) {
        table.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#888;"><i class="fas fa-spinner fa-spin"></i> Loading cloud users...</td></tr>';
        return;
      }
      const currentSession = Auth.getSession();
      table.innerHTML = users.map(u => {
        const isSelf = currentSession && currentSession.userId === u.id;
        const date = new Date(u.createdAt).toLocaleDateString();
        return '<tr>' +
          '<td><strong>' + escapeHtml(u.username) + '</strong>' + (isSelf ? ' <span style="color:var(--primary);font-size:0.8rem;">(you)</span>' : '') + '</td>' +
          '<td>' + escapeHtml(u.email) + '</td>' +
          '<td>' + roleBadge(u.role) + '</td>' +
          '<td>' + date + '</td>' +
          '<td><span style="color:#666;font-size:0.8rem;">local</span></td>' +
          '<td>' + (isSelf ? '<span style="color:#666;font-size:0.85rem;">—</span>' :
            '<button class="btn btn-sm" style="padding:4px 12px;background:rgba(255,77,77,0.1);color:#ff4d4d;border:1px solid rgba(255,77,77,0.3);border-radius:8px;" onclick="deleteLocalUser(\'' + u.id + '\')"><i class="fas fa-trash"></i></button>') +
          '</td></tr>';
      }).join('');
    }

    // Supabase profiles (real users) — replaces local list when cloud is available
    async function loadCloudUsers() {
      if (!window.SolaraDB || !SolaraDB.isReady()) {
        loadLocalUsers();
        return;
      }
      const users = await SolaraDB.listUsers();
      if (!users.length) { loadLocalUsers(); return; }

      document.getElementById('userCount').textContent = users.length;
      const table = document.getElementById('usersTable');
      const session = Auth.getSession();

      table.innerHTML = users.map(u => {
        const isSelf = session && session.userId === u.id;
        const date = u.created_at ? new Date(u.created_at).toLocaleDateString() : '—';
        return '<tr>' +
          '<td><strong>' + escapeHtml(u.username || '—') + '</strong>' + (isSelf ? ' <span style="color:var(--primary);font-size:0.8rem;">(you)</span>' : '') + '</td>' +
          '<td>' + escapeHtml(u.email || '—') + '</td>' +
          '<td>' + roleBadge(u.role) + '</td>' +
          '<td>' + date + '</td>' +
          '<td><span class="badge badge-published">cloud</span></td>' +
          '<td>' + (isSelf ? '<span style="color:#666;font-size:0.85rem;">—</span>' :
            '<select onchange="changeRole(\'' + u.id + '\', this.value)" style="padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid var(--border);color:#fff;font-size:.8rem;">' +
              '<option value="client"' + (u.role === 'client' ? ' selected' : '') + '>Client</option>' +
              '<option value="reseller"' + (u.role === 'reseller' ? ' selected' : '') + '>Reseller</option>' +
              '<option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Admin</option>' +
            '</select>') +
          '</td></tr>';
      }).join('');
    }

    async function changeRole(id, role) {
      if (!window.SolaraDB || !SolaraDB.isReady()) { alert('Supabase not connected.'); return; }
      if (!confirm('Set this user role to "' + role + '"?')) { loadCloudUsers(); return; }
      const { error } = await SolaraDB.client().from('profiles').update({ role }).eq('id', id);
      if (error) { alert('Role update failed: ' + error.message); }
      loadCloudUsers();
    }

    function deleteLocalUser(id) {
      const session = Auth.getSession();
      if (session && session.userId === id) { alert('Cannot delete your own account.'); return; }
      if (confirm('Delete this local user?')) {
        const users = Auth.getUsers().filter(u => u.id !== id);
        Auth.saveUsers(users);
        loadLocalUsers();
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }
    if (window.innerWidth <= 992) {
      document.getElementById('sidebarToggle').style.display = 'inline-block';
    }

    loadCloudUsers();
  </script>
</body>
</html>
