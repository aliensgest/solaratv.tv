function getStaticPost(key) {
  return blogPosts[key] || null;
}

function addSeoData(post) {
  const slug = post.slug || post.id || '';
  const canonicalUrl =
    location.origin + location.pathname + '?slug=' + encodeURIComponent(slug);

  let oldCanonical = document.querySelector('link[rel="canonical"]');

  if (oldCanonical) {
    oldCanonical.href = canonicalUrl;
  } else {
    const canonical = document.createElement('link');
    canonical.rel = 'canonical';
    canonical.href = canonicalUrl;
    document.head.appendChild(canonical);
  }

  let oldDescription = document.querySelector('meta[name="description"]');

  if (!oldDescription) {
    oldDescription = document.createElement('meta');
    oldDescription.name = 'description';
    document.head.appendChild(oldDescription);
  }

  oldDescription.content =
    post.excerpt ||
    'Read the latest SolaraTV IPTV guide, review, and streaming information.';

  const existingSchema = document.getElementById('articleSchema');

  if (existingSchema) {
    existingSchema.remove();
  }

  const schema = {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": post.title,
    "description": post.excerpt || "",
    "image": post.image ? [post.image] : [],
    "datePublished": post.date || post.createdAt || "",
    "dateModified": post.updatedAt || post.date || post.createdAt || "",
    "author": {
      "@type": "Organization",
      "name": post.author || "SOLARA TV"
    },
    "publisher": {
      "@type": "Organization",
      "name": "SOLARA TV"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": canonicalUrl
    }
  };

  const schemaScript = document.createElement('script');
  schemaScript.id = 'articleSchema';
  schemaScript.type = 'application/ld+json';
  schemaScript.textContent = JSON.stringify(schema);
  document.head.appendChild(schemaScript);
}

function renderPost(post) {
  document.getElementById('postTitle').textContent = post.title;

  document.title = post.title + ' | SOLARA TV Blog';

  const dateVal = post.date || post.createdAt || Date.now();

  document.getElementById('postDate').innerHTML =
    '<i class="fas fa-calendar"></i> ' +
    new Date(dateVal).toLocaleDateString('en-US', {
      year:'numeric',
      month:'long',
      day:'numeric'
    });

  document.getElementById('postAuthor').innerHTML =
    '<i class="fas fa-user"></i> ' +
    (post.author || 'SOLARA TV');

  document.getElementById('postCategory').innerHTML =
    '<i class="fas fa-tag"></i> ' +
    (post.category || 'IPTV');

  const image = document.getElementById('postImage');

  if (post.image) {
    image.src = post.image;
    image.alt = post.title;
    image.style.display = 'block';
  } else {
    image.style.display = 'none';
  }

  document.getElementById('postBody').innerHTML =
    post.content || '<p>No content available.</p>';

  addSeoData(post);
}

document.addEventListener('DOMContentLoaded', async function() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const id = params.get('id');
  const key = slug || id;

  if (!key) {
    document.getElementById('postTitle').textContent = 'Post not found';
    return;
  }

  const staticPost = getStaticPost(key);

  if (staticPost) {
    renderPost(staticPost);
    return;
  }

  const start = Date.now();

  while (
    (!window.supabase || typeof Blog === 'undefined') &&
    Date.now() - start < 3000
  ) {
    await new Promise(resolve => setTimeout(resolve, 100));
  }

  if (typeof Blog === 'undefined') {
    document.getElementById('postTitle').textContent = 'Post not found';
    return;
  }

  try {
    let post = slug ? await Blog.getBySlug(slug) : null;

    if (!post && id) {
      post = await Blog.getById(id);
    }

    if (!post) {
      document.getElementById('postTitle').textContent = 'Post not found';
      return;
    }

    renderPost(post);

  } catch (error) {
    console.warn('Post fetch failed:', error);
    document.getElementById('postTitle').textContent = 'Post not found';
  }
});
</script>
