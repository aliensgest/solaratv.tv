<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Subscriptions | SOLARA TV</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo">SOLARA TV</a>
      <nav class="sidebar-nav">
        <a href="index.html"><i class="fas fa-home"></i> My Account</a>
        <a href="subscriptions.html" class="active"><i class="fas fa-tv"></i> My Subscriptions</a>
        <a href="../blog.html"><i class="fas fa-newspaper"></i> Blog</a>
        <div class="sidebar-divider"></div>
        <a href="../index.html"><i class="fas fa-globe"></i> View Site</a>
        <a href="#" onclick="Auth.logout();return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="hamburger" onclick="toggleSidebar()" style="display:none;" id="sidebarToggle"><i class="fas fa-bars"></i></button>
          <h1>My Subscriptions</h1>
        </div>
        <div class="user-info">
          <span id="welcomeMsg">Welcome</span>
          <div class="avatar" id="userAvatar">U</div>
        </div>
      </div>

      <!-- My Subscriptions -->
      <div style="background:var(--bg-card);padding:30px;border-radius:var(--radius);border:1px solid var(--border);">
        <h3 style="margin-bottom:12px;"><i class="fas fa-tv" style="color:var(--primary);margin-right:8px;"></i> My Subscriptions</h3>
        <div id="subsList" style="color:var(--text-muted);">
          <p><i class="fas fa-spinner fa-spin"></i> Loading your subscriptions...</p>
        </div>
        <button class="btn btn-whatsapp" style="margin-top:20px;" onclick="App.openWhatsApp('I need help with my SOLARA TV subscription')">
          <i class="fab fa-whatsapp"></i> Need help?
        </button>
      </div>

      <!-- Subscribe to a new plan -->
      <div style="background:var(--bg-card);padding:30px;border-radius:var(--radius);border:1px solid var(--border);margin-top:30px;">
        <h3 style="margin-bottom:8px;"><i class="fas fa-credit-card" style="color:var(--primary);margin-right:8px;"></i> Subscribe to a New Plan</h3>
        <p style="color:var(--text-muted);margin-bottom:20px;font-size:.9rem;">Choose a plan and pay securely with PayPal — your subscription appears instantly above.</p>
        <div id="planCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;"></div>
        <p id="planMsg" style="color:var(--text-muted);font-size:.8rem;margin-top:16px;"></p>
      </div>
    </main>
  </div>

  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/analytics.js"></script>
  <script src="../assets/js/paypal.js"></script>
  <script>
    if (!Auth.requireAuth('client')) {
      document.body.innerHTML = '';
    }

    const session = Auth.getSession();
    if (session) {
      document.getElementById('welcomeMsg').textContent = 'Welcome, ' + session.username;
      document.getElementById('userAvatar').textContent = session.username.charAt(0).toUpperCase();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }
    if (window.innerWidth <= 992) {
      document.getElementById('sidebarToggle').style.display = 'inline-block';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => alert('Copied!')).catch(() => {});
    }

    // Available plans (keys match paypal.js SOLARA_PAY.plans)
    const PLANS = [
      { key: 'monthly',   name: '1 Month',   price: '€17.00' },
      { key: 'quarterly', name: '3 Months',  price: '€34.99' },
      { key: 'semi',      name: '6 Months',  price: '€55.00' },
      { key: 'annual',    name: '12 Months', price: '€90.00' },
      { key: 'biennial',  name: '24 Months', price: '€149.00' }
    ];

    function renderPlans() {
      const el = document.getElementById('planCards');
      if (!el) return;
      const trialCard =
        '<div style="border:1px solid rgba(37,211,102,.4);border-radius:12px;padding:20px;text-align:center;background:rgba(37,211,102,.06);">' +
          '<div style="color:#25D366;font-weight:700;">🎁 Free Trial</div>' +
          '<div style="font-size:1.4rem;font-weight:800;margin:10px 0;">1 Day · 0€</div>' +
          '<button class="btn btn-primary" style="width:100%;background:#25D366;border-color:#25D366;color:#fff;" onclick="startTrial()"><i class="fas fa-gift"></i> Get Free Trial</button>' +
        '</div>';
      el.innerHTML = trialCard + PLANS.map(p =>
        '<div style="border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;background:var(--bg-card-hover);">' +
          '<div style="color:var(--primary);font-weight:700;">' + p.name + '</div>' +
          '<div style="font-size:1.4rem;font-weight:800;margin:10px 0;">' + p.price + '</div>' +
          '<button class="btn btn-primary" style="width:100%;" onclick="pay(\'' + p.key + '\')"><i class="fas fa-credit-card"></i> Pay Now</button>' +
        '</div>'
      ).join('');
    }
    renderPlans();

    // Load the user's subscriptions (M3U creds, status, expiry)
    async function loadSubscriptions() {
      const listEl = document.getElementById('subsList');
      if (!listEl) return; // page redirected (not logged in)
      if (!session) { listEl.innerHTML = '<p>Please log in.</p>'; return; }
      if (!window.SolaraDB || !SolaraDB.isReady()) {
        listEl.innerHTML = '<p>Cloud service unavailable — contact us via WhatsApp.</p>';
        return;
      }
      try {
        const { data, error } = await SolaraDB.client()
          .from('subscriptions')
          .select('*')
          .eq('user_id', session.userId)
          .order('created_at', { ascending: false });
        if (error) throw error;
        if (!data || !data.length) {
          listEl.innerHTML = '<p>You don\'t have a subscription yet. Choose a plan below to get started! 👇</p>';
          return;
        }
        listEl.innerHTML = data.map(s => {
          const expire = s.expire_date ? new Date(s.expire_date + 'T00:00:00') : null;
          const today = new Date(); today.setHours(0,0,0,0);
          const active = expire && expire >= today;
          const badge = active
            ? '<span class="badge badge-published"><i class="fas fa-check-circle"></i> Active</span>'
            : '<span class="badge badge-draft"><i class="fas fa-exclamation-circle"></i> Expired</span>';
          return '<div style="border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">' +
              '<strong style="color:var(--primary);"><i class="fas fa-play-circle"></i> ' + escapeHtml((s.type || 'M3U').toUpperCase()) + ' Subscription</strong>' + badge +
            '</div>' +
            '<div style="font-family:monospace;font-size:.9rem;line-height:2;">' +
              '<div>Username: <strong style="color:#fff;">' + escapeHtml(s.username || '—') + '</strong> <button class="btn btn-sm" style="padding:2px 10px;" onclick="copyText(\'' + escapeHtml(s.username || '') + '\')">📋</button></div>' +
              '<div>Password: <strong style="color:#fff;">' + escapeHtml(s.password || '—') + '</strong> <button class="btn btn-sm" style="padding:2px 10px;" onclick="copyText(\'' + escapeHtml(s.password || '') + '\')">📋</button></div>' +
            '</div>' +
            '<div style="margin-top:10px;font-size:.85rem;color:var(--text-muted);">' +
              'Expires: <strong style="color:' + (active ? '#25D366' : '#ff6b6b') + ';">' + (expire ? expire.toLocaleDateString() : '—') + '</strong>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch (err) {
        listEl.innerHTML = '<p>Could not load subscriptions: ' + escapeHtml(err.message || err) + '</p>';
      }
    }
    loadSubscriptions();

    // Refresh subscriptions when a payment completes (without leaving the page)
    window.addEventListener('solara:payment', function () {
      document.getElementById('planMsg').textContent = 'Payment received — refreshing your subscriptions...';
      setTimeout(loadSubscriptions, 2500);
    });
  </script>
</body>
</html>
